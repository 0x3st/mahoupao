name: Daily update

on:
  schedule:
    # UTC 12:30 = 北京时间 20:30（A股收盘后，Tushare 当日数据通常已出）
    - cron: '30 12 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Sync quotes & regenerate report
        env:
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
        run: python sync_and_report.py

      - name: Commit & push artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/export/
          if git diff --cached --quiet; then
            echo "无内容变化，跳过提交（周末/节假日/数据未出）。"
          else
            git commit -m "chore: daily update $(date +%F)"
            git push
          fi
